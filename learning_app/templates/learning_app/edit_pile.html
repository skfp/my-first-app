{% load static %}
<!DOCTYPE html>
<html lang="pl">
    <head>
        <link rel="stylesheet" type="text/css" href="{% static 'learning_app/my_css.css' %}">
        <meta charset="utf-8">
    </head>

<body>
    <div class="empty_header_add"><br><div class="sign">Edit pile</div></div>
    <div class="add_card_form"> 
        <div class="login_left"></div>
        <div class="login_middle">
            <form action="{% url 'edit_pile' user_id=user_id pile_id=pile_id %}" method="POST" enctype="multipart/form-data" name="EditPile">
                {% csrf_token %}
                {{ form.new_pile_name.errors }}
                    <label for="{{ form.new_pile_name.id_for_label }}"></label> {{ form.new_pile_name }}
                <br>
                {{ form.new_cards_per_day.errors }}
                    <label for="{{ form.new_cards_per_day.id_for_label }}"></label> {{ form.new_cards_per_day }}
                <br>
                <div class="input_button">
                    <input type="submit" value="submit"/>
                </div>
            </form>
        </div>
        <div class="login_right"></div>
    </div>
    <div class="empty_footer_add">
            <br>
            <div class="sign_button">
                <a href="{% url 'start' pile_id=pile_id user_id=user_id%}">Back</a>
        </div>
        </div>
    </div>
</body>
</html>
