{% load static %}
<!DOCTYPE html>
<html lang="pl">
    <head>
        <link rel="stylesheet" type="text/css" href="{% static 'learning_app/my_css.css' %}">
        <meta charset="utf-8">
    </head>

    <body>
        <div class="empty_header"></div>
        <div class="login_register_form"> 
            <div class="login_left"></div>
            <div class="login_middle">
                <div class="sign">Sign up</div>
                <form action="{% url 'register_view' %}" method="POST" enctype="multipart/form-data" name="CreateUserForm">
                    {% csrf_token %}
                    {{ form.your_mail.errors }}
                    <label for="{{ form.your_mail.id_for_label }}"></label> {{ form.your_mail }}
                    <br>
                    {{ form.your_login.errors }}
                        <label for="{{ form.your_login.id_for_label }}"></label> {{ form.your_login }}
                    <br>
                    {{ form.your_pass.errors }}
                        <label for="{{ form.your_pass.id_for_label }}"></label> {{ form.your_pass }}
                    <br>
                    <div class="input_button">
                        <input type="submit" value="submit"/>
                    </div>
                </form>
            </div>
            <div class="login_right"></div>
        </div>
        <div class="empty_footer">

                <div class="sign_button">
                <a href="{% url 'home' %}">Go back</a>
            </div>
            </div>
        </div>
    </body>
    </html>
